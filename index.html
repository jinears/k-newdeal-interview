<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>K-뉴딜 모의면접 피드백</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: 면접 운영 콘솔 — 상단 탭(입력·취합·결과지·명단), 입력 화면은 좌측 교육생 목록 + 우측 평가지. 결과지는 종이 문서처럼. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaeef4; --line:#d5dce6; --line-strong:#b4bfcd;
  --fg:#17202c; --muted:#5a6676; --faint:#8592a3;
  --accent:#1f4f8a; --accent-ink:#ffffff; --accent-soft:#e1eaf6;
  --mark:#f2c94c; --mark-soft:#fdf3d2;
  --good:#1f7a4d; --good-soft:#dff1e7; --warn:#a86108; --warn-soft:#fbecd6; --bad:#b4322c; --bad-soft:#f8e1df;
  --paper:#fffefb; --paper-line:#e4dfd3;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-doc:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#171e28; --surface-2:#1f2834; --line:#2c3746; --line-strong:#3f4d60;
  --fg:#e6ebf2; --muted:#9aa7b8; --faint:#6f7d90;
  --accent:#7fb0ec; --accent-ink:#0d1a2b; --accent-soft:#1d3048;
  --mark:#e2b93b; --mark-soft:#3a3220;
  --good:#5cc690; --good-soft:#163527; --warn:#e7a54a; --warn-soft:#3a2a14; --bad:#ef7b74; --bad-soft:#3e1d1b;
  --paper:#1b222c; --paper-line:#323c4a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#171e28; --surface-2:#1f2834; --line:#2c3746; --line-strong:#3f4d60;
  --fg:#e6ebf2; --muted:#9aa7b8; --faint:#6f7d90;
  --accent:#7fb0ec; --accent-ink:#0d1a2b; --accent-soft:#1d3048;
  --mark:#e2b93b; --mark-soft:#3a3220;
  --good:#5cc690; --good-soft:#163527; --warn:#e7a54a; --warn-soft:#3a2a14; --bad:#ef7b74; --bad-soft:#3e1d1b;
  --paper:#1b222c; --paper-line:#323c4a; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px 0}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 260px}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.02em}
.brand h1{margin:0;font-size:18px;font-weight:700;text-wrap:balance}
.conn{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.conn.ok{background:var(--good-soft);color:var(--good)}
.conn.demo{background:var(--mark-soft);color:var(--warn)}
nav.tabs{flex-basis:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:2.5px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--fg)}
main.wrap{padding-block:20px 120px}

.banner{background:var(--mark-soft);border:1px solid var(--mark);color:var(--fg);padding:10px 14px;border-radius:var(--r);margin-bottom:16px;font-size:13px}

.btn{border:1px solid var(--line-strong);background:var(--surface);padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:7px 10px;width:100%}
textarea{resize:vertical;min-height:72px;line-height:1.55}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* 입력 화면 */
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.roster{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);max-height:calc(100vh - 140px);display:flex;flex-direction:column}
@media (max-width:860px){.roster{position:static;max-height:340px}}
.roster-head{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.roster ul{list-style:none;margin:0;padding:4px;overflow-y:auto}
.roster li button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.roster li button:hover{background:var(--surface-2)}
.roster li button[aria-current="true"]{background:var(--accent-soft)}
.roster .slot{font-family:var(--f-mono);font-size:12px;color:var(--faint);width:38px}
.roster .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:3px}
.dot{font-size:10px;font-weight:700;width:18px;height:18px;border-radius:4px;display:grid;place-items:center;background:var(--surface-2);color:var(--faint)}
.dot.on{background:var(--good-soft);color:var(--good)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.sheet{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.who{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.who .person{flex:1 1 200px;min-width:0}
.who .person h2{margin:0;font-size:22px}
.who .person p{margin:2px 0 0;color:var(--muted);font-size:13px}
.who .ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.who .ctl label.f{width:150px}

.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.clock{font-family:var(--f-mono);font-size:22px;font-weight:600;min-width:72px}
.track{flex:1 1 300px;display:flex;height:28px;border-radius:5px;overflow:hidden;position:relative;background:var(--surface-2);min-width:0}
.track span{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);border-right:1px solid var(--bg);white-space:nowrap;overflow:hidden;position:relative;z-index:1}
.track span.now{color:var(--fg);font-weight:700}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--accent-soft);z-index:0;transition:width .5s linear}

.sec h3{margin:0;font-size:15px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec h3 .t{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600;background:var(--accent-soft);padding:1px 7px;border-radius:4px}
.sec h3 .focus{font-size:12px;color:var(--muted);font-weight:500}
.sec details{margin:10px 0}
.sec summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
.sec .guide{margin:8px 0 0;padding:10px 14px;background:var(--surface-2);border-radius:6px;font-size:13px}
.sec .guide ul{margin:0;padding-left:18px}
.sec .guide li{margin:3px 0}
.sec .guide .tip{margin:8px 0 0;color:var(--muted)}
.casebox{border-left:3px solid var(--mark);background:var(--mark-soft);padding:10px 14px;border-radius:0 6px 6px 0;font-size:13px;margin:10px 0}
.casebox ol{margin:6px 0 0;padding-left:18px}

.rubric{display:flex;flex-direction:column;margin-top:8px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto 56px;gap:10px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .lbl b{display:block;font-size:14px}
.rrow .lbl small{color:var(--muted);font-size:12px;display:block}
.rrow .lbl .w{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-left:6px;font-weight:500}
.rrow .lbl .mine{font-size:11px;color:var(--accent);margin-left:6px;font-weight:600}
.pick{display:flex;gap:4px}
.pick button{width:34px;height:34px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;cursor:pointer;font-family:var(--f-mono);font-weight:600}
.pick button:hover{border-color:var(--accent)}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rrow .pts{text-align:right;font-family:var(--f-mono);font-weight:600}
.rrow .pts small{color:var(--faint);font-weight:500}
@media (max-width:560px){.rrow{grid-template-columns:minmax(0,1fr) 56px}.rrow .pick{grid-column:1/-1;order:3}}
.scale-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.scale-legend b{font-family:var(--f-mono);color:var(--fg)}
.subtotal{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:2px solid var(--fg);margin-top:4px;font-weight:700}
.subtotal .num{font-size:20px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding-block:10px}
.savebar .score{display:flex;gap:18px;align-items:baseline}
.savebar .score span{font-size:12px;color:var(--muted)}
.savebar .score b{font-family:var(--f-mono);font-size:20px;margin-left:4px}
.savebar .st{flex:1;font-size:12px;color:var(--muted);min-width:120px}
.savebar .st.dirty{color:var(--warn)}
.savebar .st.err{color:var(--bad)}

/* 취합 */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat small{color:var(--muted);font-size:12px;display:block}
.stat b{font-family:var(--f-mono);font-size:24px}
.stat b em{font-style:normal;font-size:13px;color:var(--faint);font-weight:500}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:880px;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--muted);font-weight:600;background:var(--surface-2);letter-spacing:.02em;position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:hover td{background:var(--surface-2)}
tr.click{cursor:pointer}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.gap{color:var(--warn);font-weight:700}

/* 결과지 */
.result-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:960px){.result-layout{grid-template-columns:minmax(0,1fr)}}
.paper{background:var(--paper);border:1px solid var(--paper-line);border-radius:4px;padding:36px 40px;box-shadow:0 1px 0 var(--paper-line),0 12px 30px -18px rgba(20,30,50,.35);min-width:0}
@media (max-width:560px){.paper{padding:24px 18px}}
.paper .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.06em}
.paper h2{font-family:var(--f-doc);font-size:26px;margin:4px 0 2px;font-weight:800}
.paper .meta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:13px;padding-bottom:16px;border-bottom:2px solid var(--fg)}
.paper h4{font-family:var(--f-doc);font-size:16px;margin:26px 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.paper h4 .num{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.hero-score{display:flex;flex-wrap:wrap;gap:20px 36px;align-items:flex-end;margin-top:18px}
.hero-score .big{font-family:var(--f-mono);font-size:52px;font-weight:600;line-height:1}
.hero-score .big small{font-size:18px;color:var(--faint)}
.hero-score .side{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.hero-score .side b{color:var(--fg)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:13px}
@media (max-width:560px){.bar{grid-template-columns:minmax(0,1fr) 84px}.bar .tr{grid-column:1/-1;order:3}}
.bar .tr{height:10px;background:var(--surface-2);border-radius:99px;position:relative;overflow:hidden}
.bar .tr i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.bar .tr i.low{background:var(--warn)}
.bar .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.bar .v small{color:var(--faint)}
.fb{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.fb > div{border-top:1px solid var(--paper-line);padding-top:8px}
.fb h5{margin:0 0 6px;font-size:13px}
.fb .strong h5{color:var(--good)}
.fb .grow h5{color:var(--warn)}
.fb p{margin:0 0 6px;white-space:pre-wrap;font-size:13.5px}
.fb p .by{font-size:11px;color:var(--faint);margin-right:6px}
.final-text{white-space:pre-wrap;font-size:14px;line-height:1.75;background:var(--mark-soft);padding:12px 16px;border-radius:4px}
.paper .foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--paper-line);font-size:12px;color:var(--muted)}
.side-panel{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px)}
@media (max-width:960px){.side-panel{position:static}}
.side-panel .card h3{margin:0 0 8px;font-size:14px}
.side-panel .card p{margin:0;font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 명단 */
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* 로그인 */
.login{max-width:420px;margin:40px auto;display:flex;flex-direction:column;gap:6px}
.login h2{margin:0;font-size:20px}.login p{margin:0 0 8px;color:var(--muted);font-size:13px}
.login form{display:flex;flex-direction:column;gap:12px}
.lg-msg{color:var(--bad)!important;min-height:1.2em;margin:0!important}
.linkbtn{border:0;background:none;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit}
/* 케이스 */
.proj{font-size:12.5px;color:var(--accent)}
.assigned{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px}
.assigned > b{font-size:14px}
.chg{flex-basis:100%}.chg summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600;width:fit-content}
.chg-note{margin:6px 0 0;font-size:12px;color:var(--warn)}
.casebox .ctip{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--mark);padding-top:6px;margin:0 0 8px}
.ccounts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.ccounts > div{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12.5px}
.ccounts > div.warn{border-color:var(--warn);color:var(--warn)}
.ccounts .cno{font-family:var(--f-mono);font-weight:600;font-size:12px;width:20px;height:20px;border-radius:4px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.ccounts b{font-size:15px}
.case-sel{padding:4px 8px;font-size:12.5px;min-width:150px}
.casepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.casepick button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:8px 10px;cursor:pointer}
.casepick button:hover{border-color:var(--accent)}
.casepick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.casepick .cno{font-family:var(--f-mono);font-weight:600;font-size:12px;width:20px;height:20px;border-radius:4px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.casepick button[aria-pressed="true"] .cno{background:var(--accent);color:var(--accent-ink)}
.casepick b{display:block;font-size:13px}.casepick small{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}
.case-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.case-head b{font-size:14px}
.casebox p{margin:6px 0}.casebox .ctime{font-size:12px;color:var(--warn);font-weight:600;margin:2px 0 8px}
.casebox ol li{margin:4px 0}
.cfollow{margin-top:8px}.cfollow summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:12.5px}.cfollow ul{margin:6px 0 0;padding-left:18px}
.ctag{font-family:var(--f-body);font-size:10.5px;color:var(--muted);background:var(--surface-2);border-radius:4px;padding:0 5px;font-weight:600}
.present{position:fixed;inset:0;z-index:30;background:var(--paper);overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pv{max-width:900px;margin:0 auto;font-size:clamp(16px,2.2vw,22px);line-height:1.7}
.pv-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.pv h2{font-family:var(--f-doc);font-size:clamp(24px,4vw,40px);margin:18px 0 4px;text-wrap:balance}
.pv-time{color:var(--warn);font-weight:600;font-size:.8em;margin:0 0 20px}
.pv-sit{border:2px solid var(--fg);padding:16px 22px;margin-bottom:20px}
.pv-sit b,.pv-q > b{display:block;margin-bottom:6px}
.pv-sit p{margin:6px 0}
.pv-q{background:var(--surface-2);border:2px solid var(--fg);padding:16px 22px}
.pv-q ol{margin:0;padding-left:1.4em}.pv-q li{margin:12px 0}
/* 추가 항목 */
.card.prep{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)) top/100% 3px no-repeat,var(--surface)}
.other-prep{margin-top:10px;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:6px;font-size:13px}
.other-prep ol,.preplist ol{margin:6px 0 0;padding-left:20px}.other-prep li,.preplist li{margin:3px 0}
.preplist{margin:10px 0 0;padding:10px 14px;background:var(--accent-soft);border-radius:6px;font-size:13px}
.pl-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--surface);border-radius:4px;padding:0 6px;margin-right:6px}
.pl-empty{color:var(--muted)}
.dot.prep{background:var(--accent-soft);color:var(--accent)}
.wguide{margin:8px 0 12px}
.wguide summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600;width:fit-content}
.wg{margin-top:8px;padding:10px 14px;background:var(--surface-2);border-radius:6px;font-size:13px}
.wg ul{margin:0;padding-left:18px}.wg li{margin:4px 0}.wg p{margin:6px 0}
.wg .ex{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0}
.wg .ex span{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;margin-right:8px}
.wg .ex .x{background:var(--bad-soft);color:var(--bad)}.wg .ex .o{background:var(--good-soft);color:var(--good)}
.hint{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}
.flbl{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.flbl small{font-weight:500}
.nv{display:flex;flex-direction:column;margin-top:6px}
.nvrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:9px 0;border-top:1px solid var(--line)}
.nvrow:first-child{border-top:0}
.nvrow > b{width:72px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:5px 13px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.chips button:hover{border-color:var(--accent);color:var(--fg)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips button.good[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chips button.bad[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.topin{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:center;margin-top:6px}
.topin .no{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--f-mono)}
.top3 small{font-size:11px;color:var(--muted);letter-spacing:.04em;font-weight:600}
.top3{background:var(--mark-soft);border-radius:6px;padding:12px 16px}
.top3 ol{margin:6px 0 0;padding-left:20px;font-size:14.5px;font-weight:600}
.top3 li{margin:4px 0}
.nvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 28px}
.nvline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dotted var(--paper-line);font-size:13.5px;flex-wrap:wrap}
.nvline small{color:var(--faint);font-size:11px}
.nvchip{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px}
.nvchip.good{background:var(--good-soft);color:var(--good)}
.nvchip.bad{background:var(--warn-soft);color:var(--warn)}
.habits{font-size:13px;color:var(--muted);margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.habits span{background:var(--surface-2);color:var(--fg);padding:1px 8px;border-radius:4px;font-size:12.5px}
.jobchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.jobchips span{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.fb ol{margin:0;padding-left:18px;font-size:13.5px}
.fb li{margin:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const S = {
  view:'input', db:null, demo:false, ready:false,
  students:{}, evals:{}, finals:{},
  campus:'all', search:'', sel:null, role:'hr',
  draft:null, dirty:false, saving:false, saveMsg:'', saveErr:false,

const LS = {get(k,d){try{const v=localStorage.getItem('kmi:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
            set(k,v){try{localStorage.setItem('kmi:'+k,JSON.stringify(v))}catch(e){}}};
S.role = LS.get('role','hr'); S.campus = LS.get('campus','all');

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = m => {const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2200)};
const fmt = (n,d=1) => n==null||isNaN(n)?'–':(Math.round(n*10**d)/10**d).toFixed(d);

/* ───────── 점수 계산 ───────── */
function conv(scores, items){ // 1~5점 × 배점 ÷ 5
  let sum=0, filled=0;
  for(const it of items){const v=scores?.[it.k]; if(v){sum+=v*it.w/5; filled++;}}
  return {total:sum, filled, complete:filled===items.length};
}
function isScored(e){return !!e && (Object.keys(e.scores||{}).length>0 || Object.keys(e.caseScores||{}).length>0 || !!e.strengths || !!e.improve)}
function EV(sid,r){const e=S.evals[sid+'__'+r]; return isScored(e)?e:null}
function evalsOf(sid){return ['hr','tech'].map(r=>EV(sid,r)).filter(Boolean)}
function aggregate(sid){
  const ev = evalsOf(sid);
  const avg = (items, field) => { const o={}; for(const it of items){const vs=ev.map(e=>e[field]?.[it.k]).filter(Boolean); o[it.k]=vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null;} return o;};
  const common = avg(COMMON,'scores');
  // 케이스: 실무 면접관 선택을 우선, 같은 케이스로 채점한 평가끼리만 평균
  const te=ev.find(e=>e.role==='tech'), caseDef = caseOf(S.students[sid]?.caseId || (te||ev[0])?.caseId);
  const evc = ev.filter(e=>(e.caseId||'sec')===caseDef.id);
  const cs={}; for(const it of caseDef.items){const vs=evc.map(e=>e.caseScores?.[it.k]).filter(Boolean); cs[it.k]=vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null;}
  const caseDiff = ev.some(e=>Object.keys(e.caseScores||{}).length && (e.caseId||'sec')!==caseDef.id);
  const sum = (items, o) => { let s=0, n=0; for(const it of items){ if(o[it.k]!=null){s+=o[it.k]*it.w/5;n++;} } return n?{total:s, complete:n===items.length}:{total:null,complete:false}; };
  // 면접관 간 2점 이상 차이 항목
  const gaps = COMMON.filter(it=>{const vs=ev.map(e=>e.scores?.[it.k]).filter(Boolean); return vs.length===2 && Math.abs(vs[0]-vs[1])>=2;}).map(it=>it.k);
  // 우선 개선 과제: 두 면접관의 1순위부터 번갈아 모아 최대 3개
  const lists = ev.map(e=>(e.top3||[]).map(x=>(x||'').trim()).filter(Boolean)), top3=[];
  for(let i=0;i<3;i++) for(const l of lists) if(l[i] && !top3.includes(l[i])) top3.push(l[i]);
  return {ev, common, cs, commonTotal:sum(COMMON,common), caseTotal:sum(caseDef.items,cs), caseDef, caseDiff, gaps, top3:top3.slice(0,3)};
}
function sortedStudents(){
  return Object.entries(S.students).map(([id,s])=>({id,...s}))
    .filter(s=>S.campus==='all'||s.campus===S.campus)
    .sort((a,b)=>(a.campus||'').localeCompare(b.campus||'')||(a.slot||'99').localeCompare(b.slot||'99')||(a.room||'').localeCompare(b.room||'')||(a.team||'').localeCompare(b.team||'','ko')||(a.name||'').localeCompare(b.name||'','ko'));
}
function blankDraft(){return {interviewer:LS.get('iv:'+S.role,''), scores:{}, caseScores:{}, notes:{}, strengths:'', improve:'', oneLine:'',
  nv:{}, habitWords:'', top3:['','',''], prepQs:'', jobs:[], jobNote:'', followups:''}}
function loadDraft(){
  if(!S.sel){S.draft=null;return}
  const key=S.sel+'__'+S.role, saved=S.evals[key];
  const local=LS.get('draft:'+key,null);
  if(local && (!saved || (local._ts||0) > (saved.updatedAt||0))){S.draft=local; S.dirty=true; S.saveMsg='저장되지 않은 임시 입력을 불러왔습니다';}
  else {S.draft = saved ? JSON.parse(JSON.stringify(saved)) : blankDraft(); S.dirty=false; S.saveMsg = saved?`저장됨 · ${new Date(saved.updatedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`:'아직 입력 전';}
  S.draft.scores ||= {}; S.draft.caseScores ||= {}; S.draft.notes ||= {};
  { const oe=S.evals[S.sel+'__'+(S.role==='hr'?'tech':'hr')]; S.draft.caseId = S.students[S.sel]?.caseId || S.draft.caseId || oe?.caseId || 'sec'; }
  S.draft.nv ||= {}; S.draft.jobs ||= []; S.draft.top3 = [0,1,2].map(i=>(S.draft.top3||[])[i]||'');
  S.saveErr=false;
}
function markDirty(){S.dirty=true; S.saveErr=false; S.saveMsg='저장하지 않은 변경이 있습니다'; const k=S.sel+'__'+S.role; LS.set('draft:'+k,{...S.draft,_ts:Date.now()}); renderSavebar();}

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===S.view));
  const m=$('#main');
  const banner = S.demo?`<div class="banner"><b>예시 화면</b> — Firebase 설정 전이라 예시 교육생 3명으로 보여 드립니다. 입력한 내용은 저장되지 않습니다. (설정 방법은 README 참고)</div>`:'';
  if(S.view==='input') m.innerHTML = banner+viewInput();
  else if(S.view==='summary') m.innerHTML = banner+viewSummary();
  else if(S.view==='result') m.innerHTML = banner+viewResult();
  else m.innerHTML = banner+viewRoster();
  $('#savebar').hidden = !(S.view==='input' && S.sel && S.draft);
  renderSavebar();
}
function campusSeg(){

     <span class="dots">${['hr','tech'].map(r=>`<span class="dot ${EV(s.id,r)?'on':S.evals[s.id+'__'+r]?'prep':''}" title="${ROLES[r].name} ${EV(s.id,r)?'평가 입력 완료':S.evals[s.id+'__'+r]?'사전 질문만 작성':'미입력'}">${ROLES[r].tag}</span>`).join('')}</span></button></li>`).join('');

}

function rubricRows(items, field){
  const d=S.draft;
  return items.map(it=>{const v=d[field][it.k]; return `<div class="rrow">
    <div class="lbl"><b>${esc(it.name)}<span class="w">${it.w}점</span>${it.role===S.role?'<span class="mine">중점</span>':''}</b><small>${esc(it.desc)}</small></div>
    <div class="pick" role="group" aria-label="${esc(it.name)}">${[1,2,3,4,5].map(n=>`<button data-act="score" data-f="${field}" data-k="${it.k}" data-v="${n}" aria-pressed="${v===n}" title="${n}점 · ${SCALE[n]} — ${SCALE_DESC[n]}">${n}</button>`).join('')}</div>
    <div class="pts">${v?fmt(v*it.w/5,0):'–'}<small>/${it.w}</small></div></div>`}).join('');
}

function evalForm(){
  const s=S.students[S.sel], d=S.draft, other=S.role==='hr'?'tech':'hr', oe=S.evals[S.sel+'__'+other];

      const picker=`<div class="casepick" role="group" aria-label="케이스 선택">${CASES.map(c=>`<button data-act="case" data-v="${c.id}" aria-pressed="${d.caseId===c.id}"><span class="cno">${c.no}</span><span><b>${esc(c.type)}</b><small>${esc(c.title)}</small></span></button>`).join('')}</div>`;

        : `<p class="gap" style="margin:8px 0 0;font-size:12px">명단에서 케이스가 배정되지 않았습니다. 아래에서 고르면 이 교육생에게 배정됩니다.</p>${picker}`;
      body += `
      <div class="casebox"><div class="case-head"><b>${esc(cdef.title)}</b><button class="btn" data-act="present">케이스 화면 띄우기</button></div>
      <p class="ctime">${esc(cdef.time)}</p>
      <p class="ctip">당일 배부한 케이스입니다. 짧은 시간 안에 문제를 어떻게 구조화하는지, 후속 질문에서 본인 생각으로 확장하는지를 확인하세요.</p>
      ${cdef.situation.map(p=>`<p>${esc(p)}</p>`).join('')}

      <div class="subtotal"><span>Case 점수</span><span class="num">${cc.filled?fmt(cc.total,0):'–'} <small style="font-size:13px;color:var(--faint)">/ 100</small></span></div>`;}
    else if(x.q.length) body = `<details ${x.lead===S.role?'open':''}><summary>질문 가이드</summary><div class="guide"><ul>${x.q.map(q=>`<li>${esc(q)}</li>`).join('')}</ul>${x.tip?`<p class="tip">${esc(x.tip)}</p>`:''}</div></details>${x.k==='cover'?`<div class="preplist" id="preplist">${prepList()}</div>`:''}`;
    return `<div class="card sec"><h3>${esc(x.name)}<span class="t">${x.min}분</span><span class="focus">${esc(x.focus)} · 주도: ${ROLES[x.lead].short}</span></h3>${body}
      <label class="f" style="margin-top:10px">관찰 메모<textarea id="note-${x.k}" data-note="${x.k}" placeholder="답변 요지, 인상적인 표현, 아쉬운 점을 적어 두세요">${esc(d.notes[x.k]||'')}</textarea></label></div>`;}).join('');
  const t=S.timer, el=curElapsed();
  return `<div class="card">

/* 타이머 */
function curElapsed(){const t=S.timer; return t.elapsed + (t.run?Date.now()-t.start:0)}
function clockStr(ms){const s=Math.floor(ms/1000); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function trackSpans(ms){let acc=0; const m=ms/60000; return SECTIONS.map(x=>{const now=m>=acc&&m<acc+x.min; acc+=x.min; return `<span style="width:${x.min*5}%" class="${now?'now':''}" title="${esc(x.name)} ${x.min}분">${x.min>=4?esc(x.name.split(' ')[0]):x.min+'′'}</span>`}).join('')}
setInterval(()=>{ if(!S.timer.run||S.view!=='input') return; const el=curElapsed(); const c=$('#clock'); if(c){c.textContent=clockStr(el); c.style.color=el>=1200000?'var(--bad)':''} const tr=$('#track'); if(tr) tr.innerHTML=`<div class="fill" style="width:${Math.min(100,el/12000)}%"></div>${trackSpans(el)}`;},1000);

function viewSummary(){
  const list=sortedStudents();
  if(!Object.keys(S.students).length) return S.ready?emptyRoster():'';
  const rows=list.map(s=>{const a=aggregate(s.id), f=S.finals[s.id]||{}, hr=EV(s.id,'hr'), te=EV(s.id,'tech');
    const st = f.delivered?'<span class="pill good">전달 완료</span>':(hr&&te?'<span class="pill acc">전달 대기</span>':(hr||te?'<span class="pill warn">입력 중</span>':'<span class="pill">면접 전</span>'));

      <td>${hr?esc(hr.interviewer||'✓'):'<span style="color:var(--faint)">–</span>'}</td><td>${te?esc(te.interviewer||'✓'):'<span style="color:var(--faint)">–</span>'}</td>
      ${COMMON.map(it=>`<td class="n ${a.gaps.includes(it.k)?'gap':''}" ${a.gaps.includes(it.k)?'title="면접관 간 2점 이상 차이"':''}>${fmt(a.common[it.k])}</td>`).join('')}
      <td class="n"><b>${fmt(a.commonTotal.total)}</b></td><td class="n">${fmt(a.caseTotal.total)}${a.caseTotal.total!=null?` <small class="ctag">${esc(a.caseDef.short)}</small>`:''}</td><td>${st}</td></tr>`}).join('');
  const all=list.map(s=>({s,a:aggregate(s.id),f:S.finals[s.id]}));
  const both=all.filter(x=>x.a.ev.length===2), done=all.filter(x=>x.f?.delivered);
  const avgT = both.length?both.reduce((p,x)=>p+(x.a.commonTotal.total||0),0)/both.length:null;
  const itemAvg = COMMON.map(it=>{const vs=all.map(x=>x.a.common[it.k]).filter(v=>v!=null); return {it, v:vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null}}).filter(x=>x.v!=null).sort((a,b)=>a.v-b.v);

    <div class="stat"><small>결과지 전달 완료</small><b>${done.length}<em> / ${list.length}</em></b></div>
    <div class="stat"><small>평균 환산 점수</small><b>${fmt(avgT)}<em> / 100</em></b></div>
    <div class="stat"><small>가장 보완이 필요한 항목</small><b style="font-size:15px;font-family:var(--f-body)">${itemAvg[0]?esc(itemAvg[0].it.name):'–'}</b>${itemAvg[0]?`<small class="num">평균 ${fmt(itemAvg[0].v,2)} / 5</small>`:''}</div></div>
  <div class="toolbar">${campusSeg()}<span class="grow"></span><small style="color:var(--muted)">항목 점수는 두 면접관 평균(1~5). <span class="gap">주황색</span>은 2점 이상 차이 — 보정 논의 권장</small><button class="btn" data-act="csv">CSV로 저장</button></div>
  <div class="tablebox"><table><thead><tr><th>캠퍼스</th><th>시간</th><th>이름</th><th>인사</th><th>실무</th>${COMMON.map(it=>`<th class="n" title="${esc(it.name)}">${esc(it.name.split(' ')[0].replace('AI·개발','AI·개발'))}<br><span style="font-weight:500">${it.w}</span></th>`).join('')}<th class="n">환산</th><th class="n">Case</th><th>상태</th></tr></thead><tbody>${rows||'<tr><td colspan="14" class="empty">해당 캠퍼스 교육생이 없습니다</td></tr>'}</tbody></table></div>`;
}

function sheetText(sid){
  const s=S.students[sid], a=aggregate(sid), f=S.finals[sid]||{}; const comment=S.finalDraft??f.comment??'';
  const L=[`[K-뉴딜 아카데미 모의면접 피드백] ${s.name} (${s.campus==='홍대'?'서울 홍대':s.campus}${s.slot?' · '+s.slot:''})`,'',
    `■ 환산 점수: ${a.commonTotal.total!=null?fmt(a.commonTotal.total,0):'–'} / 100   (Case 면접 「${a.caseDef.type}」 ${a.caseTotal.total!=null?fmt(a.caseTotal.total,0):'–'} / 100)`];
  const top=(S.finalTop||a.top3).filter(x=>x&&x.trim());
  if(top.length){L.push('','■ 다음 면접까지 우선 개선 과제'); top.forEach((x,i)=>L.push(`${i+1}. ${x}`));}
  L.push('','■ 역량별 평가');
  COMMON.forEach(it=>{const v=a.common[it.k]; L.push(`- ${it.name}: ${v!=null?fmt(v*it.w/5)+' / '+it.w:'–'}`)});
  L.push('','■ 잘한 점'); a.ev.filter(e=>e.strengths).forEach(e=>L.push(e.strengths));
  L.push('','■ 개선 과제'); a.ev.filter(e=>e.improve).forEach(e=>L.push(e.improve));
  const nv=NONVERBAL.map(n=>{const vs=[...new Set(a.ev.map(e=>e.nv?.[n.k]).filter(Boolean))]; return vs.length?`${n.name} ${vs.join('/')}`:''}).filter(Boolean);
  const habits=[...new Set(a.ev.flatMap(e=>(e.habitWords||'').split(/[,，、\s]+/).filter(Boolean)))];
  if(nv.length||habits.length){L.push('','■ 말투·태도'); if(nv.length) L.push(nv.join(' · ')); if(habits.length) L.push('자주 쓴 습관어: '+habits.join(', '));}
  const jobs=[...new Set(a.ev.flatMap(e=>e.jobs||[]))]; if(jobs.length){L.push('','■ 추천 직무: '+jobs.join(', ')); a.ev.filter(e=>e.jobNote).forEach(e=>L.push('- '+e.jobNote));}
  const fups=[...new Set(a.ev.flatMap(e=>(e.followups||'').split('\n').map(x=>x.trim()).filter(Boolean)))]; if(fups.length){L.push('','■ 예상 꼬리질문'); fups.forEach(q=>L.push('- '+q));}
  if(comment) L.push('','■ 종합 의견',comment);
  L.push('','※ 본 모의면접은 선발이 아닌 성장 지원을 목적으로 합니다.');
  return L.join('\n');
}

async function importRoster(file){
  const msg=$('#importMsg'); if(!file) return;
  let list; try{ list=JSON.parse(await file.text()); }catch(e){ msg.textContent='파일을 읽지 못했습니다. 명단 .json 파일인지 확인해 주세요.'; return; }
  if(!Array.isArray(list)||!list.every(x=>x&&typeof x.id==='string'&&x.data&&x.data.name)){ msg.textContent='명단 형식이 아닙니다. [{"id":..., "data":{"name":...}}] 형태여야 합니다.'; return; }
  if(S.demo){ list.forEach(x=>S.students[x.id]=x.data); render(); return; }
  msg.textContent=`${list.length}명 등록 중…`;
  let ok=0;
  for(const x of list){ try{ await S.db.doc('students/'+x.id).set(x.data); ok++; msg.textContent=`${ok}/${list.length}명 등록 중…`; }
    catch(err){ msg.textContent=isDenied(err)?'등록 권한이 없습니다. 로그인 상태를 확인해 주세요.':'일부를 등록하지 못했습니다. 다시 시도해 주세요.'; return; } }
  msg.textContent=`${ok}명을 등록했습니다`; toast(`명단 ${ok}명을 불러왔습니다`);
}
async function assignCase(sid, cid){
  if(!S.students[sid]) return;
  if(S.demo){ S.students[sid].caseId=cid||undefined; if(S.view!=='input') render(); return; }
  try{ await S.db.doc('students/'+sid).update({caseId:cid||null}); }
  catch(err){ toast(isDenied(err)?'케이스를 배정할 권한이 없습니다':'케이스를 저장하지 못했습니다. 다시 시도해 주세요'); }
}
async function autoAssign(){
  const pool=(S.casePool||CASES.map(c=>c.id)).filter(id=>CASE_BY[id]);
  const list=sortedStudents(), targets=list.filter(s=>!s.caseId);
  const cnt=Object.fromEntries(pool.map(id=>[id,list.filter(s=>s.caseId===id).length]));
  let last=null; const plan=[];
  for(const s of targets){
    const cand=[...pool].sort((x,y)=>cnt[x]-cnt[y] || (x===last)-(y===last) || pool.indexOf(x)-pool.indexOf(y));
    const pick=cand[0]; cnt[pick]++; last=pick; plan.push([s.id,pick]);
  }
  const msg=$('#assignMsg'); if(msg) msg.textContent=`${plan.length}명 배정 중…`;
  if(S.demo){ plan.forEach(([id,c])=>S.students[id].caseId=c); render(); toast(`${plan.length}명에게 케이스를 배정했습니다`); return; }
  let ok=0; for(const [id,c] of plan){ try{ await S.db.doc('students/'+id).update({caseId:c}); ok++; }catch(err){ if(isDenied(err)){ toast('케이스를 배정할 권한이 없습니다'); break; } } }
  toast(`${ok}명에게 케이스를 배정했습니다`);
}

function downloadAssignCSV(){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const lines=[['캠퍼스','시간','조','이름','면접실','캡스톤 과제','케이스 번호','케이스 유형','케이스 제목'].map(q).join(',')];
  sortedStudents().forEach(s=>{const c=CASE_BY[s.caseId]; lines.push([s.campus,s.slot,s.team,s.name,s.room,s.project,c?.no,c?.type,c?.title].map(q).join(','));});
  save(`모의면접_케이스배정_${new Date().toISOString().slice(0,10)}.csv`, '﻿'+lines.join('\r\n'));
}

/* ───────── 이벤트 ───────── */
document.addEventListener('click', async e=>{
  const tab=e.target.closest('nav.tabs button'); if(tab){S.view=tab.dataset.view; S.finalDraft=null; S.finalDirty=false; render(); window.scrollTo(0,0); return;}
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, v=el.dataset.v;
  if(act==='campus'){S.campus=v; LS.set('campus',v); S.finalDraft=null; S.resultSel=null; render();}
  else if(act==='go'){S.view=v; render();}
  else if(act==='sel'){ if(S.sel===v) return; S.sel=v; loadDraft(); render(); if(innerWidth<=860) $('.sheet')?.scrollIntoView({behavior:'smooth'});}
  else if(act==='role'){ S.role=v; LS.set('role',v); loadDraft(); render();}
  else if(act==='score'){ const f=el.dataset.f,k=el.dataset.k,n=+v; S.draft[f][k] = S.draft[f][k]===n?undefined:n; if(S.draft[f][k]===undefined) delete S.draft[f][k]; markDirty();
      el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===S.draft[f][k]));
      const items=f==='scores'?COMMON:caseOf(S.draft.caseId).items, it=items.find(i=>i.k===k); el.closest('.rrow').querySelector('.pts').innerHTML=`${S.draft[f][k]?fmt(S.draft[f][k]*it.w/5,0):'–'}<small>/${it.w}</small>`;
      const c=conv(S.draft[f],items); el.closest('.card').querySelector('.subtotal .num').firstChild.textContent=(c.filled?fmt(c.total,0):'–')+' ';}
  else if(act==='save') saveEval();
  else if(act==='case'){ if(S.draft.caseId===v) return; S.draft.caseId=v; markDirty(); assignCase(S.sel,v); const y=scrollY; render(); scrollTo(0,y); }
  else if(act==='pool'){ const p=S.casePool||CASES.map(c=>c.id); const i=p.indexOf(v); if(i<0) p.push(v); else if(p.length>1) p.splice(i,1); S.casePool=p; render(); }
  else if(act==='autoAssign') autoAssign();
  else if(act==='caseSheet') downloadCaseSheet(v);
  else if(act==='assignCsv') downloadAssignCSV();
  else if(act==='present') present(caseOf(S.draft.caseId));
  else if(act==='closePresent') $('#present').hidden=true;
  else if(act==='nv'){const k=el.dataset.k; if(S.draft.nv[k]===v) delete S.draft.nv[k]; else S.draft.nv[k]=v; el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.draft.nv[k])); markDirty();}
  else if(act==='job'){const j=S.draft.jobs, i=j.indexOf(v); if(i<0) j.push(v); else j.splice(i,1); el.setAttribute('aria-pressed',i<0); markDirty();}
  else if(act==='timer'){const t=S.timer; if(t.run){t.elapsed+=Date.now()-t.start;t.run=false}else{t.start=Date.now();t.run=true} el.textContent=t.run?'일시정지':'계속';}
  else if(act==='treset'){S.timer={start:null,elapsed:0,run:false}; render();}
  else if(act==='openResult'){S.resultSel=v; S.view='result'; S.finalDraft=null; S.finalDirty=false; render(); window.scrollTo(0,0);}
  else if(act==='rnav'){const l=sortedStudents(); const i=l.findIndex(x=>x.id===S.resultSel)+(+v); if(l[i]){S.resultSel=l[i].id; S.finalDraft=null; S.finalDirty=false; render();}}
  else if(act==='saveFinal') saveFinal();
  else if(act==='deliver') setDelivered(v==='1');
  else if(act==='copy'){const txt=sheetText(S.resultSel); try{await navigator.clipboard.writeText(txt); toast('결과지 텍스트를 복사했습니다');}catch(err){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('결과지 텍스트를 복사했습니다')}catch(_){toast('복사가 막혀 있습니다. 결과지를 직접 선택해 복사하세요')} ta.remove();}}
  else if(act==='dl') downloadSheet();
  else if(act==='csv') downloadCSV();
  else if(act==='bulkAdd') bulkAdd();
  else if(act==='delAsk'){S.rosterConfirm=v; render();}
  else if(act==='delCancel'){S.rosterConfirm=null; render();}
  else if(act==='del') delStudent(v);
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='q'){S.search=t.value.trim(); const pos=t.selectionStart; render(); const q=$('#q'); q.focus(); q.setSelectionRange(pos,pos); return;}
  if(t.id==='finalText'){S.finalDraft=t.value; markFinalDirty(); refreshPaper(); return;}
  if(t.dataset.ftop!=null){S.finalTop[+t.dataset.ftop]=t.value; markFinalDirty(); refreshPaper(); return;}
  if(!S.draft) return;
  if(t.dataset.note){S.draft.notes[t.dataset.note]=t.value; markDirty();}
  else if(t.dataset.top!=null){S.draft.top3[+t.dataset.top]=t.value; markDirty();}
  else if(t.dataset.fb){S.draft[t.dataset.fb]=t.value; markDirty(); if(t.id==='prepQs'){const pl=$('#preplist'); if(pl) pl.innerHTML=prepList();}}
  else if(t.id==='iv'){S.draft.interviewer=t.value; LS.set('iv:'+S.role,t.value); markDirty();}
});
function markFinalDirty(){ if(!S.finalDirty){S.finalDirty=true; const b=document.querySelector('[data-act="saveFinal"]'); if(b) b.textContent='결과지 내용 저장';} }
function refreshPaper(){ const p=$('#paper'); if(p&&S.resultSel) p.outerHTML=sheetHTML(S.resultSel); }
document.addEventListener('change', e=>{ if(e.target.id==='rosterFile'){importRoster(e.target.files?.[0]); e.target.value=''; return;} if(e.target.dataset.assign){assignCase(e.target.dataset.assign, e.target.value||null); return;} if(e.target.id==='rsel'){S.resultSel=e.target.value; S.finalDraft=null; S.finalDirty=false; render();} });
addEventListener('keydown', e=>{ if(e.key==='Escape'&&!$('#present').hidden){$('#present').hidden=true;return;} if(e.key==='Enter'&&e.target.matches?.('tr[data-act]')){e.target.click();return;} if((e.metaKey||e.ctrlKey)&&e.key==='s'&&S.view==='input'&&S.draft){e.preventDefault(); saveEval();} });

/* ───────── 저장 ───────── */
function isDenied(err){return err&&(err.code==='invalid_argument'||err.code==='not_granted'||err.code==='permission-denied'||err.code==='unauthenticated')}
async function saveEval(){
  if(!S.draft||S.saving) return;
  if(!S.draft.interviewer?.trim()){S.saveErr=true; S.saveMsg='면접관 이름을 입력해 주세요'; renderSavebar(); $('#iv')?.focus(); return;}
  const key=S.sel+'__'+S.role;
  const body={sid:S.sel, role:S.role, interviewer:S.draft.interviewer.trim(), scores:S.draft.scores, caseId:S.draft.caseId, caseScores:Object.fromEntries(Object.entries(S.draft.caseScores).filter(([k])=>caseOf(S.draft.caseId).items.some(i=>i.k===k))), notes:S.draft.notes, strengths:S.draft.strengths||'', improve:S.draft.improve||'', oneLine:S.draft.oneLine||'',
    nv:S.draft.nv, habitWords:S.draft.habitWords||'', top3:S.draft.top3,
    prepQs:S.draft.prepQs||'', jobs:S.draft.jobs, jobNote:S.draft.jobNote||'', followups:S.draft.followups||'', updatedAt:Date.now()};
  if(S.demo){S.evals[key]=body; S.dirty=false; S.saveMsg='예시 화면이라 이 브라우저에서만 반영됩니다'; render(); return;}
  S.saving=true; renderSavebar();
  try{ await S.db.doc('evals/'+key).set(body); S.dirty=false; S.saveErr=false; S.saveMsg=`저장됨 · ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`; try{localStorage.removeItem('kmi:draft:'+key)}catch(_){} toast(`${S.students[S.sel]?.name} · ${ROLES[S.role].short} 평가를 저장했습니다`);}
  catch(err){S.saveErr=true; S.saveMsg=isDenied(err)?'저장 권한이 없습니다. 로그인이 만료됐다면 새로고침 후 다시 로그인해 주세요':'저장하지 못했습니다. 잠시 후 다시 눌러 주세요 (입력 내용은 이 브라우저에 보관 중)';}
  S.saving=false; render();
}
async function saveFinal(){
  const sid=S.resultSel, prev=S.finals[sid]||{};
  const body={...prev, comment:S.finalDraft||'', top3:S.finalTop||[], updatedAt:Date.now()};
  if(S.demo){S.finals[sid]=body; S.finalDirty=false; render(); toast('종합 피드백을 반영했습니다 (예시)'); return;}
  try{await S.db.doc('finals/'+sid).set(body); S.finalDirty=false; toast('종합 피드백을 저장했습니다'); render();}
  catch(err){toast(isDenied(err)?'저장 권한이 없습니다':'저장하지 못했습니다. 다시 시도해 주세요');}
}
async function setDelivered(on){
  const sid=S.resultSel, prev=S.finals[sid]||{};
  const body={...prev, comment:S.finalDraft||'', top3:S.finalTop||[], delivered:on, deliveredAt:on?Date.now():null, updatedAt:Date.now()};
  if(S.demo){S.finals[sid]=body; S.finalDirty=false; render(); return;}
  try{await S.db.doc('finals/'+sid).set(body); S.finalDirty=false; toast(on?'전달 완료로 표시했습니다':'전달 표시를 취소했습니다');}
  catch(err){toast('저장하지 못했습니다. 다시 시도해 주세요');}
}
async function bulkAdd(){
  const campus=$('#bulkCampus').value, raw=$('#bulk').value; const msg=$('#bulkMsg');
  const rows=raw.split('\n').map(l=>l.split(/\t|,/).map(x=>x.trim())).filter(r=>r[0]);
  if(!rows.length){msg.textContent='붙여넣은 명단이 없습니다'; return;}
  const docs=rows.map(r=>{const c=CASES.find(c=>c.no===String(r[3]||'').trim()); const d={name:r[0], slot:(r[1]||'').replace(/^(\d):/,'0$1:'), room:r[2]||'', campus, createdAt:Date.now()}; if(c) d.caseId=c.id; return d;});
  if(S.demo){docs.forEach((d,i)=>S.students['demo'+Date.now()+i]=d); render(); return;}
  msg.textContent=`${docs.length}명 등록 중…`;
  let ok=0; for(const d of docs){ try{await S.db.collection('students').add(d); ok++;}catch(err){ if(isDenied(err)){msg.textContent='등록 권한이 없습니다'; return;} } }
  $('#bulk').value=''; msg.textContent=`${ok}명을 등록했습니다`;
}
async function delStudent(sid){
  S.rosterConfirm=null;
  if(S.demo){delete S.students[sid]; render(); return;}
  try{ await S.db.doc('students/'+sid).delete(); for(const r of ['hr','tech']) await S.db.doc('evals/'+sid+'__'+r).delete(); await S.db.doc('finals/'+sid).delete(); toast('삭제했습니다');}catch(err){toast('삭제하지 못했습니다');}
}

/* ───────── 파일 저장 ───────── */
async function save(filename, data){
  let dl=null; try{ dl = await window.claude?.use?.('downloads'); }catch(e){}
  if(!dl){
    const type=filename.endsWith('.csv')?'text/csv;charset=utf-8':'text/html;charset=utf-8';
    const blob=data instanceof Blob?data:new Blob([data],{type});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); toast('파일을 저장했습니다'); return;
  }
  try{await dl.save({filename,data}); toast('파일을 저장했습니다');}catch(err){ if(err?.code!=='declined') toast('파일을 저장하지 못했습니다'); }
}
function downloadSheet(){
  const sid=S.resultSel, s=S.students[sid];
  const css=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n');
  const html=`<!doctype html><html lang="ko" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모의면접 피드백 - ${esc(s.name)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&family=Nanum+Myeongjo:wght@700;800&display=swap"><style>${css}
  body{padding:24px 16px} .paper{max-width:820px;margin:0 auto} @media print{body{padding:0}.paper{box-shadow:none;border:0}}</style></head><body data-theme="light">${sheetHTML(sid,true)}</body></html>`;
  save(`모의면접_피드백_${s.campus}_${s.name}.html`, html);
}
function downloadCSV(){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const head=['캠퍼스','시간','이름','인사 면접관','실무 면접관',...COMMON.map(i=>`${i.name}(평균/5)`),'환산점수(/100)','Case(/100)','케이스 유형','우선개선과제','추천직무','예상꼬리질문','강점','개선과제','종합의견','전달'];
  const lines=[head.map(q).join(',')];
  sortedStudents().forEach(s=>{const a=aggregate(s.id),f=S.finals[s.id]||{},hr=EV(s.id,'hr'),te=EV(s.id,'tech');
    lines.push([s.campus,s.slot,s.name,hr?.interviewer,te?.interviewer,...COMMON.map(i=>a.common[i.k]!=null?fmt(a.common[i.k],2):''),a.commonTotal.total!=null?fmt(a.commonTotal.total):'',a.caseTotal.total!=null?fmt(a.caseTotal.total):'', a.caseTotal.total!=null?a.caseDef.type:'',
      ((f.top3&&f.top3.some(Boolean))?f.top3:a.top3).filter(Boolean).join(' / '),
      [...new Set(a.ev.flatMap(e=>e.jobs||[]))].join(', '), [...new Set(a.ev.flatMap(e=>(e.followups||'').split('\n').map(x=>x.trim()).filter(Boolean)))].join(' / '),
      a.ev.map(e=>e.strengths).filter(Boolean).join(' / '),a.ev.map(e=>e.improve).filter(Boolean).join(' / '),f.comment||'',f.delivered?'완료':''].map(q).join(','))});
  save(`모의면접_취합_${new Date().toISOString().slice(0,10)}.csv`, '﻿'+lines.join('\r\n'));
}


/* ───────── Firebase 로그인 ───────── */
function loginView(auth, msg){
  $('#savebar').hidden=true;
  $('#main').innerHTML=`<div class="card login"><h2>면접관 로그인</h2>
    <p>운영 담당자에게 받은 이메일과 비밀번호로 로그인하세요.</p>
    <form id="loginForm" novalidate>
      <label class="f">이메일<input type="text" id="lgEmail" autocomplete="username" inputmode="email" required></label>
      <label class="f">비밀번호<input type="password" id="lgPw" autocomplete="current-password" required></label>
      <p class="lg-msg" id="lgMsg">${esc(msg||'')}</p>
      <button class="btn primary" type="submit" id="lgBtn">로그인</button>
    </form></div>`;
  $('#loginForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const email=$('#lgEmail').value.trim(), password=$('#lgPw').value, btn=$('#lgBtn'), m=$('#lgMsg');
    if(!email||!password){ m.textContent='이메일과 비밀번호를 모두 입력해 주세요.'; return; }
    btn.disabled=true; btn.textContent='로그인 중…';
    try{ await auth.signInWithEmailAndPassword(email,password); location.reload(); }
    catch(err){ btn.disabled=false; btn.textContent='로그인';
      m.textContent = err?.code==='auth/too-many-requests' ? '로그인 시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.'
                    : err?.code==='auth/network-request-failed' ? '네트워크에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.'
                    : '로그인하지 못했습니다. 이메일과 비밀번호를 확인해 주세요.'; }
  });
  $('#lgEmail').focus();
}

async function connect(){
  const c=$('#conn');
  let db=null;
  if(FIREBASE_CONFIG.apiKey && window.firebase){
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth();
    const user=await new Promise(res=>{ const un=auth.onAuthStateChanged(u=>{ un(); res(u); }); });
    if(!user){ c.textContent='로그인 필요'; c.className='conn'; loginView(auth); return; }
    db=firebase.firestore();
    c.innerHTML=`${esc(user.email||'')} · <button class="linkbtn" id="logout">로그아웃</button>`; c.className='conn ok';
    $('#logout').addEventListener('click', async()=>{ await auth.signOut(); location.reload(); });
  } else {
    try{ db = await window.claude?.use?.('db'); }catch(e){}
    if(db){ c.textContent='실시간 공유 중'; c.className='conn ok'; }
  }
  if(!db){ demoData(); c.textContent='예시 데이터'; c.className='conn demo'; render(); return; }
  S.db=db;
  const fail=e=>{c.textContent='연결 끊김 · 새로고침 필요'; c.className='conn';};
  let got=0; const settle=()=>{ if(++got>=1){S.ready=true;} };
  const smartRender=()=>{
    // 입력 중일 때 전체를 다시 그리지 않음: 명단 점과 상단만 갱신
    const a=document.activeElement;
    if(S.view==='input' && a && (a.tagName==='TEXTAREA'||a.tagName==='INPUT') && a.id!=='q'){ refreshRosterDots(); return; }
    if(S.view==='result' && a && (a.id==='finalText'||a.dataset?.ftop!=null)){ return; }
    render();
  };
  db.collection('students').onSnapshot(snap=>{ S.students={}; snap.docs.forEach(d=>S.students[d.id]=d.data()); if(S.sel&&!S.students[S.sel]){S.sel=null;S.draft=null;} else if(S.draft&&S.students[S.sel]?.caseId&&S.draft.caseId!==S.students[S.sel].caseId){S.draft.caseId=S.students[S.sel].caseId;} settle(); smartRender(); }, fail);
  db.collection('evals').onSnapshot(snap=>{ S.evals={}; snap.docs.forEach(d=>S.evals[d.id]=d.data()); if(!S.finalDirty) S.finalDraft=null; if(S.sel&&!S.dirty&&!S.draft) loadDraft(); smartRender(); }, fail);
  db.collection('finals').onSnapshot(snap=>{ S.finals={}; snap.docs.forEach(d=>S.finals[d.id]=d.data()); if(!S.finalDirty) S.finalDraft=null; smartRender(); }, fail);
}
function refreshRosterDots(){
  document.querySelectorAll('.roster li button').forEach(b=>{const id=b.dataset.v; b.querySelectorAll('.dot').forEach((d,i)=>{const r=i?'tech':'hr'; d.classList.toggle('on',!!EV(id,r)); d.classList.toggle('prep',!EV(id,r)&&!!S.evals[id+'__'+r]);})});
}
render();
connect();
})();
